[project]
name = "keyvault"
version = "0.1.0"
description = "Bitwarden-backed secrets, GPG and SSH key management"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.scripts]
keyvault = "keyvault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
